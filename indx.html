<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Single Photobooth 💖</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 10px;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe6f2 0%, #fff0f5 50%, #fecfef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
            max-width: 340px;
            width: 100%;
        }

        /* --- FRAME PHOTOBOOTH SINGLE --- */
        .photobooth-frame {
            background: #ffffff;
            padding: 20px 18px 18px 18px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3);
            border: 3px solid #ffccd5;
            width: 100%;
            text-align: center;
            position: relative;
            animation: floatStrip 4s ease-in-out infinite;
        }

        .frame-header {
            font-size: 15px;
            font-weight: bold;
            color: #ff4d8d;
            letter-spacing: 2px;
            margin-bottom: 15px;
            padding: 8px;
            background-color: #fff0f5;
            border-radius: 12px;
            border: 2px dashed #ff99c2;
            text-transform: uppercase;
        }

        /* Slot Single Foto */
        .photo-slot {
            width: 100%;
            height: 300px;
            background-color: #fff5f8;
            border: 2.5px dashed #ff99cc;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .photo-slot:hover {
            border-color: #ff3385;
            background-color: #ffe6f0;
            transform: scale(1.02);
        }

        .photo-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            transition: transform 0.3s ease;
        }

        .slot-placeholder {
            text-align: center;
            color: #ff80bf;
            font-size: 14px;
            font-weight: bold;
        }

        .slot-placeholder .icon {
            font-size: 45px;
            margin-bottom: 8px;
        }

        .frame-footer {
            font-size: 12px;
            color: #ff80bf;
            margin-top: 14px;
            font-weight: 600;
        }

        /* --- KOTAK PESAN & TOMBOL --- */
        .message-card {
            background: rgba(255, 255, 255, 0.92);
            padding: 20px 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.25);
            backdrop-filter: blur(8px);
            width: 100%;
            text-align: center;
            border: 2px solid #ffffff;
        }

        h1 {
            color: #ff3385;
            font-size: 22px;
            margin: 0 0 8px 0;
            transition: opacity 0.2s ease;
        }

        p {
            color: #ff66a3;
            font-size: 14px;
            margin: 0 0 18px 0;
            line-height: 1.4;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease;
        }

        .btn {
            background: linear-gradient(45deg, #ff4d8d, #ff80bf);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(255, 77, 141, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }

        .btn:hover {
            background: linear-gradient(45deg, #ff1a66, #ff66a3);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(255, 77, 141, 0.5);
        }

        .btn:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Floating Background Animation */
        .floating-element {
            position: fixed;
            animation: fallDown linear infinite;
            z-index: 1;
            opacity: 0.6;
            pointer-events: none;
        }

        @keyframes floatStrip {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes fallDown {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Animasi Latar Belakang Emoji Melayang -->
    <script>
        const elements = ['💖', '✨', '🌸', '🎀', '🧸', '💌', '⭐'];
        for (let i = 0; i < 25; i++) {
            const el = document.createElement('div');
            el.classList.add('floating-element');
            el.textContent = elements[Math.floor(Math.random() * elements.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = Math.random() * 4 + 4 + 's';
            el.style.animationDelay = Math.random() * 5 + 's';
            el.style.fontSize = Math.random() * 18 + 18 + 'px';
            document.body.appendChild(el);
        }
    </script>

    <div class="main-wrapper">
        <!-- Bingkai Photobooth Single -->
        <div class="photobooth-frame">
            <div class="frame-header">♡ FOTO CANTIK KAMU ♡</div>

            <div class="photo-slot" onclick="document.getElementById('inputPhoto').click()">
                <input type="file" id="inputPhoto" accept="image/*" onchange="loadPhoto(event)">
                <img id="previewImg" alt="Foto Cantik">
                <div class="slot-placeholder" id="placeholderText">
                    <div class="icon">📸</div>
                    <div>KLIK UNTUK<br>TAMBAH FOTO</div>
                </div>
            </div>

            <div class="frame-footer">✨ SPECIAL PHOTOBOOTH ✨</div>
        </div>

        <!-- Kartu Ucapan Interaktif -->
        <div class="message-card">
            <h1 id="title">Hai Cantik! 💖</h1>
            <p id="message">Klik bingkainya buat masukin foto paling manis kamu ya! ✨</p>
            <button class="btn" onclick="changeVibe()">KLIK KEJUTAN! 💌</button>
        </div>
    </div>

    <script>
        // Fungsi memuat foto ke dalam bingkai
        function loadPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('previewImg');
                    const placeholder = document.getElementById('placeholderText');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    placeholder.style.display = 'none';

                    // Ubah ucapan awal saat foto pertama kali diunggah
                    document.getElementById('title').textContent = "Wah, Cantik Banget! 😍";
                    document.getElementById('message').textContent = "Fotomu di photobooth ini bikin hariku langsung cerah! 🌷";
                }
                reader.readAsDataURL(file);
            }
        }

        // Pesan berganti setiap kali tombol diklik
        const vibes = [
            { title: "Wah, Cantik Banget! 😍", msg: "Fotomu di photobooth ini bikin hariku langsung cerah! 🌷" },
            { title: "You're So Pretty! 🌸✨", msg: "Jangan lupa senyum terus ya hari ini! Senyumanmu itu candu tahu." },
            { title: "Proud Of You! 🐱💖", msg: "Semangat terus ya ngejalanin harinya! Kamu pasti bisa lewatin semuanya." },
            { title: "Sending Warm Hugs! 🐼💕", msg: "Semoga harimu selalu dipenuhi hal-hal manis dan menyenangkan ya!" },
            { title: "Inget Ya! 🌷🎀", msg: "Kamu itu berharga banget. Tetep jadi diri kamu yang ceria ya!" }
        ];

        let currentIndex = 0;

        function changeVibe() {
            const titleEl = document.getElementById('title');
            const msgEl = document.getElementById('message');

            currentIndex = (currentIndex + 1) % vibes.length;

            titleEl.style.opacity = '0';
            msgEl.style.opacity = '0';

            setTimeout(() => {
                titleEl.textContent = vibes[currentIndex].title;
                msgEl.textContent = vibes[currentIndex].msg;
                
                titleEl.style.opacity = '1';
                msgEl.style.opacity = '1';
            }, 200);
        }
    </script>
</body>
</html>
